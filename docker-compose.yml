services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ${REPOS_HOST_PATH:-/repos}:${REPOS_HOST_PATH:-/repos}:ro
    environment: &app-env
      DB_HOST: postgres
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codebase-net

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["docker-php-entrypoint"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    environment: *app-env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8081"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      app:
        condition: service_started
    networks:
      - codebase-net

  mcp-watch:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["docker-php-entrypoint"]
    command: php artisan mcp:watch-status
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    environment: *app-env
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      reverb:
        condition: service_healthy
    networks:
      - codebase-net

  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    volumes:
      - mcp_data:/data
      - ${REPOS_HOST_PATH:-/repos}:/repos:ro
    ports:
      - "127.0.0.1:${MCP_PORT:-9749}:9749"
    command:
      - codebase-memory-mcp
      - --ui=true
      - --port=9749
      - --data-dir=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9749/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - codebase-net
    profiles:
      - mcp-docker

  repos-sync:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["docker-php-entrypoint"]
    command: php artisan git:sync-repos --loop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ${REPOS_HOST_PATH:-/repos}:${REPOS_HOST_PATH:-/repos}
    environment: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codebase-net
    profiles:
      - git-sync

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - codebase-net

  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-codebase_chat}
      POSTGRES_USER: ${DB_USERNAME:-codebase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-codebase} -d ${DB_DATABASE:-codebase_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codebase-net

networks:
  codebase-net:
    driver: bridge

volumes:
  postgres_data:
  mcp_data:
